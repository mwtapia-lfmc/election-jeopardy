};

let teams = [], scores = [], board1 = {}, board2 = {}, currentRound = 1, currentQ = null, timerInterval = null, currentBuzzer = -1, timeoutHappened = false;

function playBuzzer() { const audioContext = new (window.AudioContext || window.webkitAudioContext)(); const osc = audioContext.createOscillator(); const gain = audioContext.createGain(); osc.connect(gain); gain.connect(audioContext.destination); osc.frequency.value = 800; gain.gain.setValueAtTime(0.3, audioContext.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3); osc.start(audioContext.currentTime); osc.stop(audioContext.currentTime + 0.3); }

function playWrongBuzzer() { const audioContext = new (window.AudioContext || window.webkitAudioContext)(); const osc = audioContext.createOscillator(); const gain = audioContext.createGain(); osc.connect(gain); gain.connect(audioContext.destination); osc.frequency.setValueAtTime(400, audioContext.currentTime); osc.frequency.linearRampToValueAtTime(200, audioContext.currentTime + 0.5); gain.gain.setValueAtTime(0.3, audioContext.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5); osc.start(audioContext.currentTime); osc.stop(audioContext.currentTime + 0.5); }

function startGame() {
  teams = [document.getElementById('team1').value || 'Team 1', document.getElementById('team2').value || 'Team 2', document.getElementById('team3').value || 'Team 3', document.getElementById('team4').value || 'Team 4'];
  scores = [0, 0, 0, 0];
  categoryNames1.forEach(cat => { board1[cat] = pointValues.map(v => ({ answered: false })); });
  categoryNames2.forEach(cat => { board2[cat] = pointValues.map(v => ({ answered: false })); });
  document.querySelector('.setup-screen').classList.remove('active');
  document.querySelector('.board-screen').classList.add('active');
  currentRound = 1;
  renderBoard(1);
}

function renderBoard(round) {
  const cats = round === 1 ? categoryNames1 : categoryNames2;
  let catHTML = '';
  cats.forEach((c, idx) => {
    const catClass = 'cat' + ((idx % 5) + 1);
    catHTML += '<div class="category-tag ' + catClass + '">' + c + '</div>';
  });
  document.getElementById('categories').innerHTML = catHTML;
  
  let qHTML = '';
  pointValues.forEach((v, idx) => {
    cats.forEach((cat, catIdx) => {
      const board = round === 1 ? board1 : board2;
      const answered = board[cat][idx].answered;
      qHTML += '<div class="q-nametag ' + (answered ? 'answered' : '') + '" onclick="openQuestion(' + round + ', \'' + cat.replace(/'/g, "\\'") + '\', ' + idx + ')"><div class="q-header">HELLO</div><div class="q-area">' + (answered ? '✓' : '$' + v) + '</div></div>';
    });
  });
  document.getElementById('questions').innerHTML = qHTML;
  updateScoreboard();
}

function updateScoreboard() {
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = teams.map((t, i) => '<div class="score-nametag ' + teamColors[i] + '"><div class="score-header"><div class="score-hello">HELLO</div><div class="score-subtext">my name is</div></div><div class="score-area"><div class="score-name ' + teamFonts[i] + '">' + t + '</div><div class="score-value">$' + scores[i] + '</div></div></div>').join('');
}

function openQuestion(round, cat, idx) {
  const board = round === 1 ? board1 : board2;
  if (board[cat][idx].answered) return;
  
  const qs = round === 1 ? questionsRound1 : questionsRound2;
  const q = qs[cat][idx];
  const val = pointValues[idx];
  
  currentQ = { round, cat, idx, val };
  currentBuzzer = -1;
  timeoutHappened = false;
  
  document.getElementById('q-category').textContent = cat + ' for $' + val;
  document.getElementById('question-text').textContent = q.text;
  
  const buzzers = teams.map((t, i) => '<button class="buzz-btn ' + teamColors[i] + '" onclick="buzz(' + i + ')"></button>').join('');
  document.getElementById('buzzers').innerHTML = buzzers;
  document.getElementById('choices').style.display = 'none';
  
  startTimer();
  document.getElementById('modal').classList.add('active');
}

function buzz(idx) {
  if (currentBuzzer >= 0) return;
  playBuzzer();
  clearInterval(timerInterval);
  currentBuzzer = idx;
  
  document.querySelectorAll('.buzz-btn').forEach(b => b.disabled = true);
  document.querySelectorAll('.buzz-btn')[idx].classList.add('active');
  
  const qs = currentQ.round === 1 ? questionsRound1 : questionsRound2;
  const q = qs[currentQ.cat][currentQ.idx];
  
  const choicesHTML = q.choices.map((c, i) => '<button class="choice-btn" onclick="answerQuestion(' + i + ', ' + q.correct + ')">' + String.fromCharCode(65+i) + '. ' + c + '</button>').join('');
  document.getElementById('choices').innerHTML = choicesHTML;
  document.getElementById('choices').style.display = 'grid';
}

function answerQuestion(chosen, correct) {
  clearInterval(timerInterval);
  const isCorrect = chosen === correct;
  
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => b.disabled = true);
  btns[correct].classList.add('correct');
  if (chosen !== correct) btns[chosen].classList.add('incorrect');
  
  if (isCorrect) {
    playBuzzer();
    scores[currentBuzzer] += currentQ.val;
    const board = currentQ.round === 1 ? board1 : board2;
    board[currentQ.cat][currentQ.idx].answered = true;
    setTimeout(() => { document.getElementById('modal').classList.remove('active'); document.getElementById('modal').classList.remove('timeout'); renderBoard(currentQ.round); }, 2000);
  } else {
    playWrongBuzzer();
    document.querySelectorAll('.buzz-btn')[currentBuzzer].disabled = true;
    const available = Array.from(document.querySelectorAll('.buzz-btn')).filter(b => !b.disabled);
    if (available.length === 0) {
      document.getElementById('modal').classList.add('timeout');
      setTimeout(() => { document.getElementById('modal').classList.remove('active'); document.getElementById('modal').classList.remove('timeout'); renderBoard(currentQ.round); }, 2000);
    } else {
      currentBuzzer = -1;
      document.getElementById('choices').style.display = 'none';
      document.querySelectorAll('.buzz-btn').forEach(b => b.disabled = false);
    }
  }
}

function startTimer() {
  let t = 30;
  document.getElementById('timer').textContent = '30';
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    t--;
    document.getElementById('timer').textContent = t;
    if (t <= 0) {
      clearInterval(timerInterval);
      timeoutHappened = true;
      document.getElementById('modal').classList.add('timeout');
      playWrongBuzzer();
      setTimeout(() => { document.getElementById('modal').classList.remove('active'); document.getElementById('modal').classList.remove('timeout'); renderBoard(currentQ.round); }, 3000);
    }
  }, 1000);
}

function nextRound() {
  document.querySelector('.board-screen').classList.remove('active');
  document.getElementById('transition').classList.add('active');
  
  const label = currentRound === 1 ? 'ROUND 1' : 'ROUND 2';
  document.getElementById('transition-title').textContent = 'END OF ' + label;
  document.getElementById('transition-scores').innerHTML = teams.map((t, i) => '<div class="score-nametag ' + teamColors[i] + '"><div class="score-header"><div class="score-hello">HELLO</div><div class="score-subtext">my name is</div></div><div class="score-area"><div class="score-name ' + teamFonts[i] + '">' + t + '</div><div class="score-value">$' + scores[i] + '</div></div></div>').join('');
}

function advanceGame() {
  document.getElementById('transition').classList.remove('active');
  
  if (currentRound === 1) {
    currentRound = 2;
    document.querySelector('.board-screen').classList.add('active');
    document.querySelector('.round-label').textContent = 'ROUND 2';
    renderBoard(2);
  } else {
    document.getElementById('fj-screen').classList.add('active');
    startFinalJeopardy();
  }
}

function startFinalJeopardy() {
  document.getElementById('fj-wagers').innerHTML = teams.map((t, i) => '<div class="team-wager"><h3 class="' + teamFonts[i] + '">' + t + '</h3><div style="color: #CCCCCC; margin-bottom: 1rem;">Current: $' + scores[i] + '</div><input type="number" class="wager-input" id="wager-' + i + '" placeholder="0" min="0"></div>').join('');
}

function revealFJClue() {
  document.getElementById('fj-screen').classList.remove('active');
  document.getElementById('fj-clue-screen').classList.add('active');
  
  document.getElementById('fj-clue-text').textContent = finalJeopardy.clue;
  document.getElementById('fj-answers').innerHTML = teams.map((t, i) => {
    const wager = parseInt(document.getElementById('wager-' + i).value) || 0;
    return '<div class="team-wager"><h3 class="' + teamFonts[i] + '">' + t + '</h3><div style="color: #CCCCCC;">Wager: $' + wager + '</div><input type="text" class="fj-answer-input" id="fj-answer-' + i + '" placeholder="Type answer..."><div style="color: #CCCCCC; margin-top: 0.5rem;">Current: $' + scores[i] + '</div></div>';
  }).join('');
}

function calculateFinalScores() {
  for (let i = 0; i < teams.length; i++) {
    const wager = parseInt(document.getElementById('wager-' + i).value) || 0;
    const answer = document.getElementById('fj-answer-' + i).value.toLowerCase();
    const correct = finalJeopardy.choices[finalJeopardy.correct].toLowerCase();
    
    if (answer.includes(correct.split(' ')[0]) || correct.includes(answer.split(' ')[0])) {
      scores[i] += wager;
    } else if (answer.length > 0) {
      scores[i] -= wager;
    }
  }
  
  document.getElementById('fj-clue-screen').classList.remove('active');
  document.getElementById('game-over').classList.add('active');
  
  const maxScore = Math.max(...scores);
  const winner = teams[scores.indexOf(maxScore)];
  
  document.getElementById('final-scores').innerHTML = teams.map((t, i) => '<div class="score-nametag ' + teamColors[i] + '"><div class="score-header"><div class="score-hello">HELLO</div><div class="score-subtext">my name is</div></div><div class="score-area"><div class="score-name ' + teamFonts[i] + '">' + t + '</div><div class="score-value">$' + scores[i] + '</div></div></div>').join('');
  document.getElementById('winner-text').textContent = winner.toUpperCase() + ' WINS!';
}
</script>
</body>
</html>
